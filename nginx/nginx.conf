worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Docker registry 客户端不兼容 gzip，禁用所有压缩
    gzip off;

    # 从反向代理头提取真实客户端 IP
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Real-IP;
    real_ip_recursive on;

    # registry blob 传输超时放宽
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 30s;

    # 客户端上传大层
    client_max_body_size 0;

    upstream registry-hub  { server 127.0.0.1:5001; }
    upstream registry-ghcr { server 127.0.0.1:5002; }
    upstream registry-gcr  { server 127.0.0.1:5003; }

    # ── 默认: Docker Hub mirror 模式 (与 daemon.json registry-mirrors 配合) ──
    map $request_uri $mirror_upstream {
        default "hub";
    }

    server {
        listen 5000;
        server_name _;

        # ── 鉴权: auth_request 子请求 ──
        location = /_auth {
            internal;
            proxy_pass http://127.0.0.1:8080/api/auth/check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Forwarded-For $remote_addr;
        }

        # ── 路由分发 ──

        # 默认 → Docker Hub
        location / {
            auth_request /_auth;
            proxy_pass http://registry-hub;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ghcr.io
        location /ghcr/ {
            auth_request /_auth;

            # 去掉 /ghcr 前缀后转发
            rewrite ^/ghcr/(.*)$ /$1 break;
            proxy_pass http://registry-ghcr;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # gcr.io
        location /gcr/ {
            auth_request /_auth;

            rewrite ^/gcr/(.*)$ /$1 break;
            proxy_pass http://registry-gcr;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
