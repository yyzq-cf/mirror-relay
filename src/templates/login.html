{% extends 'base.html' %}
{% block title %}登录 · Mirror Relay{% endblock %}
{% block content %}
<div class="card login-wrap" style="text-align: center;">
    <a href="https://github.com/yyzq-cf/mirror-relay" target="_blank" style="text-decoration: none; display: inline-block; margin-bottom: 0.5rem;">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="logo" width="48" height="48" style="border-radius: 10px;">
    </a>
    <h2 style="margin-bottom: 1rem;">🔐 登录管理面板</h2>
    {% if error %}
    <p style="color: var(--danger); margin-bottom: 1rem; font-size: 0.875rem;">{{ error }}</p>
    {% endif %}
    <form method="POST" action="/login">
        <input type="password" name="password" class="input" placeholder="管理员密码" autofocus style="margin-bottom: 0.75rem;">
        <button type="submit" class="btn btn-primary" style="width: 100%;">登录</button>
    </form>
    <a href="https://github.com/yyzq-cf/mirror-relay" target="_blank" style="display: inline-flex; align-items: center; gap: 6px; margin-top: 1.25rem; color: var(--muted); font-size: 0.8rem; text-decoration: none;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        GitHub
    </a>
</div>
{% endblock %}
