<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mirror Relay{% endblock %}</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --border: #334155;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --primary: #0ea5e9;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
            --hover: rgba(255,255,255,0.04);
        }
        [data-theme="light"] {
            --bg: #f1f5f9;
            --card: #ffffff;
            --border: #cbd5e1;
            --text: #1e293b;
            --muted: #64748b;
            --primary: #0284c7;
            --danger: #dc2626;
            --success: #16a34a;
            --warning: #d97706;
            --hover: rgba(0,0,0,0.03);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg); color: var(--text); line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }
        .nav {
            background: var(--card); border-bottom: 1px solid var(--border);
            padding: 0 1.5rem; display: flex; align-items: center;
            height: 56px; position: sticky; top: 0; z-index: 100;
        }
        .nav-brand { font-weight: 700; font-size: 1.1rem; margin-right: 2rem; color: var(--primary); }
        .nav a { color: var(--muted); text-decoration: none; padding: 0.5rem 0.8rem; border-radius: 6px; font-size: 0.9rem; }
        .nav a:hover, .nav a.active { color: var(--text); background: var(--border); }
        .nav-right { margin-left: auto; }
        .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; margin-bottom: 1rem; transition: background 0.3s, border-color 0.3s; }
        .card h2 { font-size: 1rem; color: var(--muted); margin-bottom: 0.75rem; font-weight: 600; }
        .grid { display: grid; gap: 1rem; }
        .grid-4 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
        .stat { text-align: center; }
        .stat .num { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
        .stat .label { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
        th { text-align: left; color: var(--muted); padding: 0.5rem; border-bottom: 1px solid var(--border); font-weight: 600; }
        td { padding: 0.5rem; border-bottom: 1px solid var(--border); }
        tr:hover td { background: var(--hover); }
        .btn { display: inline-block; padding: 0.4rem 0.9rem; border-radius: 6px; border: none; cursor: pointer; font-size: 0.85rem; text-decoration: none; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-sm { padding: 0.25rem 0.6rem; font-size: 0.8rem; }
        .input { width: 100%; padding: 0.5rem 0.75rem; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 0.875rem; }
        .input:focus { outline: none; border-color: var(--primary); }
        .form-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; }
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge-success { background: rgba(34,197,94,0.15); color: var(--success); }
        .badge-warning { background: rgba(245,158,11,0.15); color: var(--warning); }
        .badge-danger { background: rgba(239,68,68,0.15); color: var(--danger); }
        .badge-muted { background: rgba(148,163,184,0.15); color: var(--muted); }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background: var(--border); border-radius: 24px; transition: 0.3s; }
        .slider:before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.3s; }
        input:checked + .slider { background: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }
        .toast { position: fixed; top: 70px; right: 20px; padding: 0.75rem 1.25rem; border-radius: 8px; color: #fff; z-index: 999; font-size: 0.875rem; }
        .toast-ok { background: var(--success); }
        .toast-err { background: var(--danger); }
        .login-wrap { max-width: 360px; margin: 80px auto; }
        textarea.input { min-height: 120px; font-family: monospace; }
        .bar { height: 8px; border-radius: 4px; background: var(--border); overflow: hidden; margin-top: 0.5rem; }
        .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
        .theme-btn { background: none; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 1.1rem; padding: 4px 8px; line-height: 1; color: var(--text); }
        .theme-btn:hover { background: var(--border); }
    </style>
    <script>
        // 防闪：在页面渲染前同步读取主题
        (function() {
            var t = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
</head>
<body>
    <nav class="nav">
        <span class="nav-brand">
            <a href="https://github.com/yyzq-cf/mirror-relay" target="_blank" style="text-decoration: none; display: flex; align-items: center; gap: 6px;">
                <img src="{{ url_for('static', filename='logo.svg') }}" alt="logo" width="28" height="28" style="vertical-radius: 5px;">
                <span style="color: var(--primary);">Mirror Relay</span>
            </a>
        </span>
        {% if session.get('logged_in') %}
        <a href="/" class="{{ 'active' if active == 'dashboard' else '' }}">📊 仪表盘</a>
        <a href="/cache" class="{{ 'active' if active == 'cache' else '' }}">📦 缓存列表</a>
        <a href="/logs" class="{{ 'active' if active == 'logs' else '' }}">📋 拉取日志</a>
        <a href="/whitelist" class="{{ 'active' if active == 'whitelist' else '' }}">🛡 白名单</a>
        <a href="/settings" class="{{ 'active' if active == 'settings' else '' }}">⚙️ 设置</a>
        <span class="nav-right" style="display: flex; align-items: center; gap: 0.5rem;">
            {% if version %}
            <img src="{{ url_for('static', filename='logo.svg') }}" alt="logo" width="18" height="18" style="border-radius: 3px;">
            <span style="color: var(--muted); font-size: 0.75rem; font-family: monospace; background: var(--border); padding: 2px 8px; border-radius: 4px;">{{ version }}</span>
            {% endif %}
            <a href="https://github.com/yyzq-cf/mirror-relay" target="_blank" title="GitHub" style="text-decoration: none; display: flex; align-items: center;">
                <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" style="color: var(--muted);">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
                </svg>
            </a>
            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn" title="切换主题">🌙</button>
            <a href="/logout">退出</a>
        </span>
        {% endif %}
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block script %}{% endblock %}
    <script>
        function toggleTheme() {
            var current = document.documentElement.getAttribute('data-theme');
            var next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            document.getElementById('themeBtn').textContent = next === 'dark' ? '🌙' : '☀️';
        }
        // 页面加载时同步按钮图标
        (function() {
            var t = localStorage.getItem('theme') || 'dark';
            var btn = document.getElementById('themeBtn');
            if (btn) btn.textContent = t === 'dark' ? '🌙' : '☀️';
        })();
    </script>
</body>
</html>
